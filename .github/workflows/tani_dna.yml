name: TANI DNA EVOLUSI - 1x Sehari

on:
  schedule:
    - cron: '0 23 * * *' # jam 23:00 UTC tiap hari (06:00 WIB)
  workflow_dispatch:

jobs:
  dna-evolusi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas numpy requests --quiet

      - name: Run DNA Evolusi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tani_dna.py

      - name: Save DNA
        run: |
          git config user.name "DNA Bot"
          git config user.email "dna@tani.com"
          git add .dna_tani_v12.json .quorum_rekomendasi.json 2>/dev/null || true
          git diff --staged --quiet && echo "No DNA changes" && exit 0
          git commit -m "🧬 DNA Evolusi $(date -u) [skip ci]" || true
          git push || true
