name: TANI V8.8 HYBRID FINAL - OTONOM EVOLUSI ANTI BLOKIR ANTI SPAM TP 200$
on:
  schedule:
    - cron: '0,30 * * * *'  # tiap 30 menit otonom
  workflow_dispatch:

jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests pandas yfinance pytz numpy
      
      - name: Run Ratu Tani V8.8 Hybrid Final Form
        run: python kerajaan_semut_emas_tani_v8.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}  # fallback buat V5
