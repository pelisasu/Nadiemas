name: TANI V8.8.1 FIX CACHE - OTONOM EVOLUSI ANTI BLOKIR TP 200$ + DNA CACHE
on:
  schedule:
    - cron: '0,30 * * * *'  # tiap 30 menit otonom
  workflow_dispatch:

jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache DNA Evolusi (biar gudang & Lv gak reset)
        uses: actions/cache@v3
        with:
          path: |
            .dna_tani_v8.json
            .memory_tani_v8.json
            .last_tani_v8.json
          key: tani-v8-dna-${{ github.run_id }}
          restore-keys: |
            tani-v8-dna-
      
      - name: Install dependencies
        run: |
          pip install requests pandas yfinance pytz numpy
      
      - name: Run Ratu Tani V8.8.1 FIX 100% SELL
        run: python kerajaan_semut_emas_tani_v8.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      
      - name: Show Gudang & Evolusi
        if: always()
        run: |
          echo "=== GUDANG TANI ==="
          cat .memory_tani_v8.json || echo "memory belum ada"
          echo ""
          echo "=== TOP 3 DNA ==="
          cat .dna_tani_v8.json | python -m json.tool | head -50 || echo "dna belum ada"
