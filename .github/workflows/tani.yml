name: TANI V8.8 HYBRID FINAL - OTONOM EVOLUSI ANTI BLOKIR ANTI SPAM TP 200$
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests pandas yfinance pytz numpy
      - run: python kerajaan_semut_emas_tani_v8.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
