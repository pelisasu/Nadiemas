name: TANI V8.2 CAKEP - 3 SINYAL SEHARI GUDANG PENUH
on:
  schedule:
    - cron: '0,30 * * * *'  # tiap 30 menit biar tenaga keisi + 3 sinyal/hari
  workflow_dispatch:

jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests pandas yfinance pytz
      
      - name: Run Ratu Tani V8.2 Cakep
        run: python kerajaan_semut_emas_tani_v8.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
