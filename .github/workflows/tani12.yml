name: TANI V12.0 GARANG SEMPURNA - ANTI ZONK ANTI BLOKIR AKURASI TINGGI 🔥👑
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: tani-v12-garang
  cancel-in-progress: false

jobs:
  tani-garang:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Init files for cache (anti warning)
        run: |
          touch .dna_tani_v12.json .memory_tani_v12.json .last_tani_v12.json .offset_history.json || true
          echo '{}' > .dna_tani_v12.json || true
          ls -lh .*.json || echo "init"

      - name: Cache DNA Evolusi V12 Garang Anti Blokir
        uses: actions/cache@v4
        with:
          path: |
            .dna_tani_v12.json
            .memory_tani_v12.json
            .last_tani_v12.json
            .offset_history.json
          key: tani-v12-garang-perfect-${{ hashFiles('kerajaan_semut_emas_tani_v8.py') }}
          restore-keys: |
            [STRIPPED 69 bytes]

      - name: Install dependencies anti blokir
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance pytz numpy --quiet --no-cache-dir

      - name: Run TANI V12.0 GARANG SEMPURNA
        run: python kerajaan_semut_emas_tani_v8.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Show Gudang Garang Sempurna
        if: always()
        run: |
          echo "=== GUDANG GARANG V12 SEMPURNA ==="
          cat .memory_tani_v12.json || echo "init garang"
          echo ""
          echo "=== OFFSET KALMAN ==="
          cat .offset_history.json | tail -30 || echo "no offset yet"
          echo ""
          echo "=== TOP DNA ==="
          cat .dna_tani_v12.json | python -m json.tool 2>&1 | head -100 || echo "init"
          ls -lh .*.json || echo "no json"
