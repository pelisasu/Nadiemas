name: Nadi Emas Final
on:
  schedule:
    - cron: '*/20 0-22 * * 1-5'
  workflow_dispatch:
concurrency:
  group: nadi-final
  cancel-in-progress: true
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas yfinance pytz
      - run: sleep $((RANDOM % 55))
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python nadi_emas_final.py
