name: TEST HEADWAY DEMO - CEK KONEKSI ID+PASSWORD
on:
  workflow_dispatch:  # jalanin manual aja buat test demo

jobs:
  test-demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install MT5 + Test Koneksi Demo
        run: |
          pip install MetaTrader5
          python test_headway_demo.py
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
