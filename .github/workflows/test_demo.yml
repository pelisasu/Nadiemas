name: TEST HEADWAY DEMO - CEK KONEKSI ID+PASSWORD
on:
  workflow_dispatch:

jobs:
  test-demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Check Secrets
        run: |
          if ("${{ secrets.MT5_LOGIN }}" -eq "") { Write-Error "MT5_LOGIN belum set!"; exit 1 }
          if ("${{ secrets.MT5_PASSWORD }}" -eq "") { Write-Error "MT5_PASSWORD belum set!"; exit 1 }
          Write-Host "[OK] Secrets set: LOGIN=${{ secrets.MT5_LOGIN }} SERVER=${{ secrets.MT5_SERVER }}"
        shell: powershell
      
      - name: Install MT5 Headway Terminal
        run: |
          Write-Host "[INFO] Download MT5 Headway..."
          $installer = "$env:TEMP\headway5setup.exe"
          $url1 = "https://download.mql5.com/cdn/web/headway.trade.ltd/mt5/headway5setup.exe"
          $url2 = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          try {
            Invoke-WebRequest -Uri $url1 -OutFile $installer -TimeoutSec 90
            Write-Host "[OK] Downloaded Headway MT5"
          } catch {
            Write-Host "[WARN] Coba generic MT5..."
            Invoke-WebRequest -Uri $url2 -OutFile $installer -TimeoutSec 90
          }
          Write-Host "[INFO] Install silent..."
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 20
          Get-ChildItem "C:\Program Files" -Filter "*MetaTrader*" -Directory | ForEach-Object { Write-Host $_.FullName }
          if (Test-Path "C:\Program Files\Headway MetaTrader 5\terminal64.exe") { Write-Host "[OK] Found Headway MT5" }
          if (Test-Path "C:\Program Files\MetaTrader 5\terminal64.exe") { Write-Host "[OK] Found MT5" }
        shell: powershell
      
      - name: Test Koneksi Demo 4731137
        run: |
          $env:PYTHONIOENCODING="utf-8"
          pip install MetaTrader5
          python test_headway_demo.py
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_SYMBOL: ${{ secrets.MT5_SYMBOL }}
          MT5_PATH: C:\Program Files\Headway MetaTrader 5\terminal64.exe
