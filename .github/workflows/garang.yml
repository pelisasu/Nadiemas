name: TANI V12.3 GARANG - Anti Blokir GitHub+Binance

on:
  schedule:
    - cron: '3,13,23,33,43,53 0-16 * * 1-5'
  workflow_dispatch:

concurrency:
  group: tani-garang
  cancel-in-progress: true

jobs:
  tani-garang:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Random Jitter (Anti Blokir)
        run: |
          DELAY=$((RANDOM % 45))
          echo "Jitter $DELAY detik..."
          sleep $DELAY

      - name: Check if market open
        id: market
        run: |
          DOW=$(date -u +%u)
          HOUR=$(date -u +%H)
          if [ "$DOW" -gt 5 ]; then
            echo "Weekend skip"
            echo "open=false" >> $GITHUB_OUTPUT
          elif [ "$DOW" -eq 5 ] && [ "$HOUR" -ge 21 ]; then
            echo "Jumat tutup skip"
            echo "open=false" >> $GITHUB_OUTPUT
          else
            echo "open=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.market.outputs.open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # FIX: Hapus cache biar ga cari requirements.txt

      - name: Install deps
        if: steps.market.outputs.open == 'true'
        run: |
          pip install pandas numpy requests yfinance --quiet

      - name: Run TANI V12.3 Anti Blokir
        if: steps.market.outputs.open == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BALANCE: ${{ secrets.BALANCE || '1000' }}
        run: |
          python tani.py

      - name: Commit dengan aman (Anti Ban GitHub)
        if: steps.market.outputs.open == 'true'
        run: |
          git config --global user.name "Ratu Tani Bot"
          git config --global user.email "bot@tani.garang"
          git add .dna_tani_v12.json .memory_tani_v12.json .last_tani_v12.json .offset_history.json .position_tani.json .cache_binance.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No changes, skip push - anti blokir GitHub!"
            exit 0
          fi
          
          LAST_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "")
          if echo "$LAST_MSG" | grep -q "Update TANI"; then
            LAST_TIME=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            NOW=$(date +%s)
            DIFF=$((NOW - LAST_TIME))
            if [ $DIFF -lt 600 ]; then
              echo "Last bot commit $DIFF detik lalu, skip biar ga spam"
              exit 0
            fi
          fi

          git commit -m "🔥 Update TANI $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push || echo "Push failed"
